# gigaverse-app/celery: Celery's worker checked with pytest-obligation's contract in t/due_work.
#
# Two lanes: this fork's own code, and Celery's current main (its celery/ package checked out
# over this fork's), nightly and on demand. A change in what any failure leaves turns a lane red:
# that is the signal to report upstream, as a plain issue with a standalone reproduction.
# Nightly and on demand, the sync job first merges Celery's main into the branch, so the fork
# itself stays current and not only what it tests.
name: Obligation contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync with Celery main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the merge
    steps:
      # GITHUB_TOKEN may not push commits that change workflow files, and Celery's often do. A
      # FORK_SYNC_TOKEN secret (contents and workflows write on this repository) lifts that; without
      # it such a sync fails here, visibly, and "Sync fork" on GitHub does it by hand.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge Celery's main into ${{ github.ref_name }}
        run: |
          git fetch --no-tags https://github.com/celery/celery.git main
          upstream="$(git rev-parse --short FETCH_HEAD)"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already has Celery main \`$upstream\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com             merge --no-edit -m "Merge Celery main $upstream" FETCH_HEAD || {
            echo "::error::Celery's main conflicts with this branch; merge it by hand."
            exit 1
          }
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Could not push the merge. If Celery's new commits change workflow files, add a FORK_SYNC_TOKEN secret with contents and workflows write access, or press Sync fork on GitHub."
            exit 1
          fi
          echo "Merged Celery main \`$upstream\`." >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: contract (${{ matrix.celery }})
    # After the sync, whatever it did; on a push or a pull request there is no sync.
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the report's PR comment on same-repo PRs; a fork PR's token stays read-only
    strategy:
      fail-fast: false
      matrix:
        celery: [this-fork, upstream-main]
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          # Nightly and on demand, the branch head after the sync rather than the commit that started the run.
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name || '' }}
      - name: Check out Celery's current main package
        if: matrix.celery == 'upstream-main'
        run: |
          git fetch --no-tags --depth 1 https://github.com/celery/celery.git main
          git checkout FETCH_HEAD -- celery
          echo "Celery main: [\`$(git rev-parse --short FETCH_HEAD)\`](https://github.com/celery/celery/commit/$(git rev-parse FETCH_HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '**/setup.py'
      - name: Install tox
        run: python -m pip install --upgrade pip 'tox' tox-gh-actions
      - name: Run tox for "3.13-due_work"
        id: tests
        run: tox --verbose --verbose -e 3.13-due_work -- --due-work-profile-report=obligation-profiles.json
      - name: Report what the contract proved
        if: ${{ !cancelled() }}
        uses: gigaverse-app/pytest-obligation/report@v1
        with:
          application-paths: t/due_work
          report-path: obligation-profiles.json
          expected-reports: '1'
          test-outcome: ${{ steps.tests.outcome }}
          sticky-key: celery-${{ matrix.celery }}

  readme:
    # Keeps the Celery-main lane's report in .github/README.md, the fork's front page, with a badge.
    # It runs no tests: it re-renders the lane's uploaded evidence, so it is the only job that can write.
    name: README report (Celery main)
    needs: contract
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the README block and the badge when they change
    concurrency:
      group: obligation-readme-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name || '' }}
      - name: Download the Celery-main lane's evidence
        uses: actions/download-artifact@v8
        with:
          name: obligation-celery-upstream-main-${{ github.run_attempt }}
          path: evidence
      - name: Read that lane's test outcome
        id: lane
        run: echo "outcome=$(jq -r .test_outcome evidence/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Render the report into the README and the badge
        # Unreleased: gigaverse-app/pytest-obligation#171 adds readme-path and badge-path; v1 once released.
        uses: gigaverse-app/pytest-obligation/report@eb0df468b2c6c290b069ad76b88e176e3feef419
        with:
          application-paths: t/due_work
          report-path: evidence/reports/*.json
          expected-reports: '1'
          test-outcome: ${{ steps.lane.outputs.outcome }}
          post-comment: 'false'
          sticky-key: celery-readme
          readme-path: .github/README.md
          readme-source: nightly run of t/due_work against Celery's current main
          badge-path: .github/obligation-badge.json
      - name: Commit them if the evidence changed
        run: |
          git add .github/README.md .github/obligation-badge.json
          if git diff --cached --quiet; then
            echo "The report is unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Update the pytest-obligation report from Celery main"
          git push origin "HEAD:${GITHUB_REF_NAME}"
